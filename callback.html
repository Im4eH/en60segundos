<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autorización completada · En 60 Segundos</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --text: #e8eefc;
      --muted: #9aa8c7;
      --accent: #5eead4;
      --line: #243049;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, sans-serif;
      background: radial-gradient(900px 500px at 50% -20%, #1a2744 0%, var(--bg) 60%);
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: min(480px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 32px 28px;
      text-align: center;
    }
    .ok {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(94, 234, 212, 0.15);
      color: var(--accent);
      font-size: 1.6rem;
      font-weight: 700;
    }
    h1 { margin: 0 0 10px; font-size: 1.35rem; }
    p { margin: 0; color: var(--muted); line-height: 1.55; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .home { display: inline-block; margin-top: 22px; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main class="card">
    <div class="ok" aria-hidden="true">✓</div>
    <h1>Autorización completada</h1>
    <p>Puedes cerrar esta ventana y volver a la aplicación.</p>
    <p class="home"><a href="index.html">Volver al inicio</a></p>
  </main>
</body>
</html>
